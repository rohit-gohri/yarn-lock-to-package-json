name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-edge-cases:
    runs-on: ubuntu-latest
    name: Edge Cases
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "yarn"

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --verbose
